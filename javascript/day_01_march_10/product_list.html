<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        h3 {
            color: blueviolet;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3 class="text-center">Product List</h3>
        <div id="productContainer" class="row">

        </div>
    </div>
    <script>
        async function fetchProducts() {
            let response = await fetch('https://fakestoreapi.com/products');
            let productArr = await response.json();
            console.log(productArr);
            const container = document.getElementById('productContainer')
            productArr.forEach(product => {
                const col = document.createElement('div');
                col.className = 'col-sm-3 mb-2'
                col.innerHTML = `
                    <div class="card">
                    <img src="${product.image}" class="card-img-top" alt="..." style="height:200px">
                    <div class="card-body text-center">
                        <h5 class="card-title">${product.category}</h5>
                        <p class="card-text text-truncate">${product.title}</p>
                        <p class="card-text text-truncate">${product.description}</p>
                        <p class="card-text">${product.price}</p>
                        <p class="card-text">${product.rating.rate}</p>
                        <a href="#" class="btn btn-primary">Details</a>
                    </div>
                    </div>
                `;
                container.appendChild(col)
            })
        }
        fetchProducts()
    </script>
</body>

</html>
