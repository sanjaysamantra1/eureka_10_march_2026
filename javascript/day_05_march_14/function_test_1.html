<script>
    function sumOfDigits(num) {
        let sum = 0;
        while (num > 0) {
            sum += num % 10;
            num = Math.floor(num / 10);
        }
        return sum;
    }
    console.log(sumOfDigits); // This is not function call

    console.log(sumOfDigits(125));  // 8
</script>
