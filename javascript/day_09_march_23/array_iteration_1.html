<script>
    // 1.loop   2.for-in   3.for-of	 4.forEach()
    let cars = ['Tata', 'Honda', 'maruti', 'Hyundai'];

    // 1. loop
    for (let i = 0; i < cars.length; i++) {
        console.log(cars[i]);
    }
    console.log('==========')

    // 2. for-in
    for (i in cars) {
        console.log(cars[i], i);
    }
    console.log('==========')

    // for-of
    for (car of cars) {
        console.log(car)
    }
    console.log('==========')

    // forEach(callback)
    cars.forEach((val, ind, arr) => {
        console.log(val, ind, arr)
    })
</script>
