<script>
    var a = 10;
    let b = 20;
    const c = 30;

    function f1() {
        console.log('F1 starts...')
        var d = 40; // function, can be used only inside f1()
        e = 50; // global 
        console.log(`a is: ${a}`)
        console.log(`b is: ${b}`)
        console.log(`c is: ${c}`)
        console.log(`d is: ${d}`)
        console.log(`e is: ${e}`)
        console.log('F1 ends...')
    }
    function f2() {
        console.log('F2 starts...')
        console.log(`a is: ${a}`)
        console.log(`b is: ${b}`)
        console.log(`c is: ${c}`)
        // console.log(`d is: ${d}`)
        console.log(`e is: ${e}`)
        console.log('F2 ends...')
    }

    f1();
    f2();

// Note: Variables declared without var/let/const are always global 
</script>
