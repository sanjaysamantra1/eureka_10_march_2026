<script>
    let str = 'entertainment';

    console.log(str.indexOf('n'));     // 1
    console.log(str.lastIndexOf('n')); // 11

    console.log(str.indexOf('h'));  // -1


    // print the first non-repeated char
    for (char of str) {
        if (str.indexOf(char) == str.lastIndexOf(char)) {
            console.log(char);
            break;
        }
    }
</script>
