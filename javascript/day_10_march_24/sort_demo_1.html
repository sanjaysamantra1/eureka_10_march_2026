<script>
    let arr1 = [30, 10, 50, 40, 20];
    arr1.sort();
    console.log(arr1);

    let arr2 = [90, 10, 91, 92, 102, 103, 104, 105, 11, 12, 13, 7, 8, 9];
    arr2.sort(); // string sort 
    console.log(arr2);

    arr2.sort((a, b) => a - b); // Numeric asc sort
    console.log(arr2)
</script>
