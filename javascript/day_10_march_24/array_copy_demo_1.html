<script>
    let arr1 = [10, 20];
    let arr2 = arr1;  // 1. reference Copy
    // A new array is not being created, the same array is referenced by 2 variables
    arr1.push(30);
    arr2.push(40);
    console.log('arr1 ', arr1);
    console.log('arr2 ', arr2);

    // Shallow Copy
    let arr3 = [10, 20, [30, 31]];
    let arr4 = [...arr3]; // Spread - Shallow Copy 
    // A new array is created and values are copied from old array to new array
    // top level elements are copied by value, nested elements are copied by reference
    arr3.push(40, 50);
    arr3[2].push(32, 33);
    console.log('arr3 ', arr3);
    console.log('arr4 ', arr4);


    // Deep Copy
    let arr5 = [10, 20, [30, 31]];
    let arr6 = structuredClone(arr5); // Deep Copy 
    // A new array is created and all values are copied from old array to new array
    arr5.push(40, 50);
    arr5[2].push(32, 33);
    console.log('arr5 ', arr5);
    console.log('arr6 ', arr6);
</script>
