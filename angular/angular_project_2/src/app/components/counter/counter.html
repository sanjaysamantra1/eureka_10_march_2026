<div class="border border-3 rounded-3 col-sm-4 offset-4 text-center mt-2 p-2">
  <h3>Counter App Using ngRx</h3>
  <h4>Count: {{count$ | async}}</h4>

  <button (click)="decrement()" class="btn btn-secondary">Decrement</button>
  <button (click)="reset()" class="btn btn-danger mx-2">Reset</button>
  <button (click)="increment()" class="btn btn-success">Increment</button>
</div>
